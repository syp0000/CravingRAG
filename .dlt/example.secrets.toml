# Copy this file to .dlt/secrets.toml and fill in real values.
# .dlt/secrets.toml is gitignored. This example file is not — keep it free of real credentials.
#
# ⚠️ This is for running dlt LOCALLY (on your laptop). dlt is the tool that pushes data INTO
#    Snowflake, so it runs as a client outside Snowflake — not in a Snowflake notebook.

[destination.snowflake.credentials]

# `host` is the ACCOUNT IDENTIFIER, not a full URL and not the web address.
#   Account URL:  https://kgiotue-wn98412.snowflakecomputing.com
#   host       =  "kgiotue-wn98412"
# Find it in Snowsight: bottom-left account menu → hover your account → "Copy account identifier"
host = "YOUR_ACCOUNT_IDENTIFIER"

username  = "YOUR_USER"
database  = "CRAVING_RAG"
warehouse = "CRAVING_WH"
role      = "ACCOUNTADMIN"

# ------------------------------------------------------------------
# AUTHENTICATION — use key pair, not a password
# ------------------------------------------------------------------
# Snowflake accounts now enforce MFA, and password auth fails for programmatic
# connections with:
#     "MFA authentication is required, but none of your current MFA methods
#      are supported for programmatic authentication"
# Snowflake is phasing out password-based service access entirely through 2026,
# so key pair auth is the correct path, not a workaround.
#
# 1. Generate a key pair (outside the repo — never commit a private key):
#      mkdir -p ~/.snowflake/keys && cd ~/.snowflake/keys
#      openssl genrsa 2048 | openssl pkcs8 -topk8 -inform PEM -out craving_rag_key.p8 -nocrypt
#      chmod 600 craving_rag_key.p8
#      openssl rsa -in craving_rag_key.p8 -pubout -out craving_rag_key.pub
#
# 2. Register the PUBLIC key in Snowsight, with the BEGIN/END lines stripped
#    and joined into one line:
#      ALTER USER YOUR_USER SET RSA_PUBLIC_KEY='MIIBIjANBgkq...';
#
# 3. Point dlt at the PRIVATE key:
private_key_path = "/Users/YOU/.snowflake/keys/craving_rag_key.p8"

# The key above is unencrypted, which is fine for a local trial account. To encrypt it,
# drop `-nocrypt` in step 1 and add:
#   private_key_passphrase = "your passphrase"
