# CI overrides projectKey/organization from repository variables (see .github/workflows/ci.yml).
# For a local run: sonar-scanner -Dsonar.organization=<org> -Dsonar.projectKey=<owner>_<repo>
sonar.projectKey=syp0000_CravingRAG
sonar.projectName=CravingRAG
sonar.sources=pipelines,provenance,ui,eval
sonar.tests=pipelines,provenance,ui
sonar.test.inclusions=**/test_*.py,ui/app/src/**/*.test.jsx,ui/app/src/test-setup.js
sonar.exclusions=ui/app/coverage/**,**/node_modules/**,ui/app/dist/**,ui/app/public/**,**/*.mp4,**/*.png,data/**,archive/**,**/__pycache__/**,.venv/**,ui/app/dist/gallery.json
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=ui/app/coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Quality gate. Gates live server-side, not in this file. In SonarCloud:
#   Administration → Quality Gates → Create "CravingRAG" (copy of Sonar way), conditions on new code:
#     Coverage >= 80%, Duplicated Lines < 3%, Reliability/Security/Maintainability rating = A,
#     Security Hotspots Reviewed = 100%; no condition on overall coverage (raised gradually).
#   Then Project → Administration → Quality Gate → select it. New code definition: previous version.
#
# Reviewed contextual findings (not suppressed; disposition recorded here and in README):
#   pipelines/generate_demo_demand.py, eval/confidence.py: random.Random(seed) is statistical
#     sampling with a fixed seed for reproducibility; no security use. Mark "Safe" in the
#     hotspot review with that reason.
#   ui/app/vite.config.js: http://localhost:8642 proxy targets are the local dev server only;
#     production TLS terminates at Cloudflare. Mark "Safe".
