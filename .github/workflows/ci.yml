# Runs on every push and pull request. Tests and builds need no credentials: the Python
# suite stubs the Snowflake connector and the React tests mock the network.
# Sonar analysis runs only when the SONAR_TOKEN secret exists (forks and local clones
# skip it). Repository configuration (Settings → Secrets and variables → Actions):
#   secret   SONAR_TOKEN          required; a SonarCloud/SonarQube analysis token
#   secret   SONAR_HOST_URL       optional; defaults to https://sonarcloud.io
#   variable SONAR_ORGANIZATION   required for SonarCloud; the organization key
#   variable SONAR_PROJECT_KEY    optional; defaults to <owner>_<repo>, unique per fork
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: ui/app/coverage/lcov.info

  sonar:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    # `secrets` is not readable in a job-level `if`; gate on an env mirror instead.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blame data for new-code detection
      - uses: actions/download-artifact@v4
        with:
          name: coverage-python
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: ui/app/coverage
      - name: Skip without SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not set; analysis skipped"
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        if: env.SONAR_TOKEN != ''
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
