    category: constraint
    relevant_uids: []

  # --- cross-lingual: Korean query against the English corpus ---------------
  # Tests that the multilingual embedding model actually earns its place.
  # If these score near zero, the wrong model is configured.
  - id: q17
    text: "상큼하고 과즙이 터지는"
    category: cross_lingual
    relevant_uids: []

  - id: q18
