  # --- constraint: where PURE VECTOR SEARCH IS EXPECTED TO STRUGGLE ---------
  # These need exact-term matching, which is why hybrid search (arm C) should win here.
  # If C does not beat B on this category specifically, investigate before reporting.
  - id: q13
