  - id: q20
    text: "느끼한 거 먹고 난 다음 입가심"
    category: cross_lingual
    relevant_uids: []

# ============================================================
# Report template (fill in after running — put this in the README)
# ============================================================
# | Arm | Recall@5 | Indexing credits | Cost / query |
# |-----|----------|------------------|--------------|
# | A — raw ingredients, vector      |  |  |  |
# | B — enriched profile, vector     |  |  |  |
# | C — enriched profile, hybrid     |  |  |  |
#
# Break Recall@5 down BY CATEGORY too. The headline average hides the interesting story:
# the expected result is B >> A on sensory, and C >> B on constraint.
# If the per-category pattern does not match that, the explanation is the finding.
#
# Worst 3-5 queries + one-line diagnosis each:
#   - qNN: ...
