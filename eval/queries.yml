# ============================================================
# V2 evaluation queries — FROZEN as of 2026-07-31 (W1.5)
# ============================================================
# These 15 queries are judged against BOTH systems (V1 baseline, then V2), graded 0-3
# per eval/JUDGING.md. Do not reword after judging starts — a changed query between the
# two rounds invalidates the comparison.
#
# Every query was verified to have >=3 answer candidates in the curated 342-row corpus
# before freezing (exclusion queries verified to contain dishes that MUST be removed:
# kung pao / pad thai carry peanuts, marzipan / macaron / frangipane carry almond,
# clam chowder / tom yum / crab cake carry shellfish).
#
# Grading: 3 = perfect match · 2 = good · 1 = somewhat relevant · 0 = irrelevant
# (0-3 collapses to binary for Recall@5; NDCG@5 uses the grades directly.)

queries:
  # --- sensory ---------------------------------------------------------------
  - id: q01
    text: "spicy warm soup"
    category: sensory
  - id: q02
    text: "refreshing juicy dish"
    category: sensory
  - id: q03
    text: "rich comforting meal"
    category: sensory
  - id: q04
    text: "crispy on the outside, tender inside"
    category: sensory
  - id: q05
    text: "light and clean, nothing heavy"
    category: sensory
  - id: q06
    text: "savory noodle soup"
    category: sensory

  # --- occasion --------------------------------------------------------------
  - id: q07
    text: "cozy dinner for a cold day"
    category: occasion
  - id: q08
    text: "quick casual lunch"
    category: occasion
  - id: q09
    text: "sweet treat for a celebration"
    category: occasion
  - id: q10
    text: "summer picnic food"
    category: occasion
  - id: q11
    text: "something cold for a hot day"
    category: occasion

  # --- exclusion: the designed-in V2 win -------------------------------------
  # V1 has no exclusion mechanism; these are EXPECTED to fail in the baseline.
  # That failing number is what makes V2's fix legible.
  - id: q12
    text: "spicy dish without peanuts"
    category: exclusion
  - id: q13
    text: "comforting dessert without almonds"
    category: exclusion
  - id: q14
    text: "warm soup with no shellfish"
    category: exclusion

  # --- constraint ------------------------------------------------------------
  - id: q15
    text: "rich chocolate dessert"
    category: constraint
