# ============================================================
# Phase 5 evaluation set
# ============================================================
# HOW TO USE
#   1. Freeze a fixed corpus subset (~200 enriched recipes) and evaluate against only that.
#      A small fully-labeled corpus beats a large partially-labeled one.
#   2. For each query below, fill `relevant_uids` with the uids that SHOULD be retrieved.
#      Shortcut: have an LLM propose candidates, then verify by hand.
#      ⚠️ If you do that, say so in the README — LLM-assisted labels bias results toward
#         what an LLM considers similar, which is the very thing being measured.
#   3. Run all three arms (A: raw ingredients, B: enriched, C: enriched + hybrid)
#      and compute Recall@5 per query, then average.
#
#   Recall@5 = |relevant ∩ top5| / min(5, |relevant|)
#
# Aim for 3-5 relevant recipes per query. Queries with 0 labels are unusable; queries with
# 20+ make Recall@5 meaningless.
# ============================================================

queries:
  # --- sensory: the queries this project exists to answer -------------------
  - id: q01
    text: "something refreshing and bursting with juice"
    category: sensory
    relevant_uids: []

  - id: q02
    text: "rich creamy and indulgent"
    category: sensory
    relevant_uids: []

