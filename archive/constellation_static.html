function S(tag, attrs, parent){ const el=document.createElementNS('http://www.w3.org/2000/svg',tag);

function curve(x1,y1,x2,y2){ const mx=(x1+x2)/2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; }
function star(x,y,r,fill,parent){ let p=''; for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2,
  rr=i%2?r*0.44:r; p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1);}
  return S('path',{d:p+'Z',fill:fill},parent); }

    <div class="meter"><i style="width:${e.value*100}%"></i><b style="left:${e.target*100}%"></b></div>`;
    e.evidence.slice(0,3).forEach(ev=>{ h+=`<div class="ev">“${ev}”</div>`; }); h+=`</div>`; });
  card.innerHTML=h;
}
draw('q01');
</script></body></html>
