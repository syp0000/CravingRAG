<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>CravingRAG</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#070b18; --ink:#e8ecf8; --dim:#8b93ad; --gold:#ffd479; --cyan:#7fd4ff;
          --violet:#b39dff; --ghost:#ff6b6b; --panel:#0e1430; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background: radial-gradient(1400px 800px at 50% 30%, #101a3a 0%, var(--bg) 65%);
         color:var(--ink); font:15px/1.5 "Avenir Next","Segoe UI",sans-serif; overflow:hidden; }
  #sky { position:fixed; inset:0; }
  .star { transition: opacity .6s, r .6s; }
  .dead { transition: opacity 1.2s; }
  /* hero */
  #hero { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:18px; transition: all .7s cubic-bezier(.4,0,.2,1); z-index:5; }
  #hero.docked { inset:auto 0 auto 0; top:0; flex-direction:row; justify-content:flex-start;
                 padding:14px 24px; gap:14px; background:linear-gradient(180deg,rgba(7,11,24,.9),transparent); }
  #hero h1 { font-size:34px; font-weight:600; letter-spacing:.5px; text-shadow:0 0 30px rgba(255,212,121,.25); }
  #hero.docked h1 { font-size:18px; }
  #hero p.tag { color:var(--dim); margin-top:-8px; }
  #hero.docked p.tag { display:none; }
  #qform { display:flex; gap:10px; }
  #qbox { width:min(520px,80vw); background:rgba(14,20,48,.85); color:var(--ink);
          border:1px solid #2a3560; border-radius:12px; padding:14px 18px; font-size:17px; outline:none; }
  #qbox:focus { border-color:var(--gold); box-shadow:0 0 24px rgba(255,212,121,.15); }
  #hero.docked #qbox { padding:9px 14px; font-size:15px; width:min(420px,50vw); }
  button { background:var(--gold); color:#1a1405; border:none; border-radius:12px; padding:0 22px;
           font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:wait; }
  /* pipeline strip */
  #pipe { position:fixed; top:64px; left:24px; right:24px; z-index:4; display:none;
          align-items:center; gap:8px; flex-wrap:wrap; }
  .stage { font-size:13px; color:var(--dim); border:1px solid #232d55; border-radius:20px;
           padding:4px 12px; opacity:.35; transition:.4s; }
  .stage.on { opacity:1; color:var(--ink); border-color:#3a4a85; }
  .stage.done { opacity:.8; color:var(--cyan); }
  .chip { font-size:13px; border-radius:20px; padding:4px 12px; opacity:0; transition:.5s; }
  .chip.show { opacity:1; }
  .chip.c { border:1px solid #4a3d78; color:var(--violet); }
  .chip.a { border:1px solid #2a4a63; color:var(--cyan); }
  .chip.x { border:1px solid #5a2233; color:var(--ghost); }
  #count { position:fixed; right:26px; top:70px; z-index:4; text-align:right; font-size:13px;
           color:var(--dim); display:none; }
  #count b { color:var(--ink); font-size:20px; display:block; }
  /* result card */
  #card { position:fixed; right:0; top:110px; bottom:0; width:340px; padding:18px 22px; z-index:4;
          overflow:auto; display:none; background:linear-gradient(90deg,transparent,rgba(7,11,24,.92) 18%); }
  #card h2 { font-size:16px; }
  #card .rk { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .ax { margin:9px 0; }
  .ax .nm { display:flex; justify-content:space-between; font-size:13px; color:var(--cyan); }
  .ax .meter { height:5px; background:#1b2447; border-radius:3px; margin:4px 0 5px; position:relative; }
  .ax .meter i { position:absolute; height:100%; border-radius:3px; background:var(--cyan); }
  .ax .meter b { position:absolute; top:-3px; width:2px; height:11px; background:var(--gold); }
  .ev { font-size:12.5px; color:var(--dim); border-left:2px solid #2a3560; padding-left:9px; margin:3px 0; }
  .vecnote { color:var(--gold); font-size:13px; }
  #err { position:fixed; bottom:20px; left:24px; color:var(--ghost); font-size:13px; z-index:6; }
  @media (max-width:900px){
    #card { top:auto; bottom:0; left:0; right:0; width:auto; max-height:38vh;
            background:linear-gradient(180deg,transparent,rgba(7,11,24,.95) 22%); } }
  text { font-family:inherit; }
  .dishlab { fill:var(--ink); font-size:13.5px; cursor:pointer; }
  .deathlab { fill:var(--ghost); font-size:11px; }
</style></head><body>
<svg id="sky"></svg>
<div id="hero">
  <h1>✦ CravingRAG</h1>
  <p class="tag">every dish is a star — tell the sky what you feel like eating</p>
  <form id="qform"><input id="qbox" placeholder="warm spicy soup, no shellfish…" autocomplete="off">
  <button id="go">search</button></form>
</div>
<div id="pipe">
  <span class="stage" id="st-parse">parse craving</span>
  <span id="concepts"></span>
  <span class="stage" id="st-axes">map to axes</span>
  <span id="axes"></span>
  <span class="stage" id="st-excl">hard exclusion</span>
  <span id="excls"></span>
  <span class="stage" id="st-rank">rank survivors</span>
</div>
<div id="count"><b id="cnum"></b><span id="clab"></span></div>
<div id="card"></div>
<div id="err"></div>
<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('sky');
let W=innerWidth, H=innerHeight;
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const stars={};   // recipe_id -> {el, x, y, labelEl?}
function S(tag,attrs,parent){const el=document.createElementNS(NS,tag);
  for(const k in attrs)el.setAttribute(k,attrs[k]);(parent||svg).appendChild(el);return el;}
function hash(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=n*0x27d4eb2d; n=n^(n>>>15); return (n>>>0)/4294967295; }
function starPath(x,y,r){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.44:r;
  p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1);}return p+'Z';}
// decorative dust
for(let i=0;i<140;i++){const c=S('circle',{cx:Math.random()*W,cy:Math.random()*H,
  r:Math.random()*.9+.2,fill:'#fff',opacity:(Math.random()*.28+.05).toFixed(2)});
  c.innerHTML=`<animate attributeName="opacity" values="${c.getAttribute('opacity')};.02;${c.getAttribute('opacity')}" dur="${(3+Math.random()*6).toFixed(1)}s" repeatCount="indefinite"/>`;}
// catalog stars
fetch('/catalog').then(r=>r.json()).then(cat=>{
  cat.forEach(d=>{const x=40+hash(d.recipe_id)* (W-80), y=60+hash(d.recipe_id*7+13)*(H-140);
    const el=S('circle',{cx:x,cy:y,r:1.9,fill:'#dfe6ff',opacity:.75,class:'star'});
    el.innerHTML=`<animate attributeName="opacity" values=".75;.35;.75" dur="${(2.5+hash(d.recipe_id*3)*5).toFixed(1)}s" repeatCount="indefinite"/>`;
    stars[d.recipe_id]={el,x,y,title:d.title};});
}).catch(e=>err('catalog: '+e));
function err(m){document.getElementById('err').textContent=m;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function stage(id,cls){const el=document.getElementById(id);el.classList.remove('on','done');if(cls)el.classList.add(cls);}
function chips(id,items,cls){const box=document.getElementById(id);box.innerHTML='';
  items.forEach((t,i)=>{const s=document.createElement('span');s.className='chip '+cls;s.textContent=t;
    box.appendChild(s);setTimeout(()=>s.classList.add('show'),i*160);});}
let busy=false, lines=[], labels=[];
document.getElementById('qform').onsubmit=async e=>{
  e.preventDefault(); if(busy)return;
  const qtext=document.getElementById('qbox').value.trim(); if(!qtext)return;
  busy=true; document.getElementById('go').disabled=true; err('');
  document.getElementById('hero').classList.add('docked');
  document.getElementById('pipe').style.display='flex';
  document.getElementById('card').style.display='none';
  document.getElementById('count').style.display='block';
  // reset sky
  lines.forEach(l=>l.remove()); labels.forEach(l=>l.remove()); lines=[]; labels=[];
  Object.values(stars).forEach(s=>{s.el.setAttribute('opacity',.75);s.el.setAttribute('r',1.9);
    s.el.setAttribute('fill','#dfe6ff');s.el.style.transform='';});
  ['st-parse','st-axes','st-excl','st-rank'].forEach(i=>stage(i));
  ['concepts','axes','excls'].forEach(i=>document.getElementById(i).innerHTML='');
  cnt(Object.keys(stars).length,'dishes in the sky');
  stage('st-parse','on');
  let R;
  try { R=await (await fetch('/search?q='+encodeURIComponent(qtext))).json(); }
  catch(ex){ err('server unreachable — is ui/server.py running?'); busy=false; document.getElementById('go').disabled=false; return; }
  if(R.error){ err(R.error); busy=false; document.getElementById('go').disabled=false; return; }
  stage('st-parse','done'); chips('concepts',R.concepts,'c'); await sleep(R.concepts.length*160+350);
  stage('st-axes','on');
  chips('axes',R.axes.map(a=>`${a.axis} → ${a.target}`),'a'); await sleep(R.axes.length*160+350);
  stage('st-axes','done');
  // exclusion — stars die
  stage('st-excl','on');
  chips('excls',R.excludes.map(x=>'no '+x),'x');
  const dead=R.excluded||[];
  for(let i=0;i<dead.length;i++){const s=stars[dead[i].recipe_id]; if(!s)continue;
    s.el.setAttribute('fill','var(--ghost)'); s.el.setAttribute('r',3.4);
    if(i<6){const t=S('text',{x:s.x+6,y:s.y-6,class:'deathlab',opacity:0});t.textContent=dead[i].matched;
      t.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:1600}); labels.push(t);}
    setTimeout(((el)=>()=>{el.classList.add('dead');el.setAttribute('opacity',.06);})(s.el),260+i*36);
    await sleep(36);}
  (R.components||[]).forEach(rid=>{const s=stars[rid]; if(s){s.el.setAttribute('opacity',.10);}});
  await sleep(900); stage('st-excl','done');
  cnt(Object.keys(stars).length-dead.length-(R.components||[]).length,'survive the filters');
  // ranking — the sky dims, five stars become the constellation
  stage('st-rank','on');
  Object.values(stars).forEach(s=>{if(+s.el.getAttribute('opacity')>.3)s.el.setAttribute('opacity',.22);});
  await sleep(500);
  const cardW = W>900 ? 340 : 0;   // card overlays on narrow screens; keep stars clear of it when possible
  const cx=(W-cardW)*0.52, cy=H*0.55, RR=Math.min(W-cardW,H)*0.26;
  const pos=R.top.map((d,i)=>{const a=-Math.PI/2+i*(Math.PI*2/5);
    return [cx+RR*Math.cos(a)*(1+(i%2)*.15), cy+RR*Math.sin(a)*(1+(i%2)*.12)];});
  // constellation lines
  for(let i=0;i<R.top.length;i++){const [x1,y1]=pos[i],[x2,y2]=pos[(i+1)%R.top.length];
    const l=S('line',{x1,y1,x2,y2,stroke:'var(--gold)',opacity:0,'stroke-width':1});
    l.animate([{opacity:0},{opacity:.35}],{duration:900,delay:900+i*150,fill:'forwards'}); lines.push(l);}
  R.top.forEach((d,i)=>{const s=stars[d.recipe_id]; const [tx,ty]=pos[i];
    if(s){ s.el.style.transition='transform 1.1s cubic-bezier(.3,0,.2,1)';
      s.el.style.transform=`translate(${tx-s.x}px,${ty-s.y}px)`;
      s.el.setAttribute('opacity',1);s.el.setAttribute('r',0.1);}
    const st=S('path',{d:starPath(tx,ty,11-i*1.2),fill:'#fff',opacity:0,class:'dish-final'});
    st.animate([{opacity:0},{opacity:1}],{duration:700,delay:800+i*140,fill:'forwards'});
    const t=S('text',{x:tx+18,y:ty+5,class:'dishlab',opacity:0});
    t.textContent=`${i+1}. ${d.title.length>30?d.title.slice(0,29)+'…':d.title}`;
    t.animate([{opacity:0},{opacity:1}],{duration:700,delay:950+i*140,fill:'forwards'});
    st.onmouseenter=t.onmouseenter=()=>showCard(R,d,i); labels.push(st,t);});
  await sleep(1400); stage('st-rank','done');
  cnt(R.top.length,'top matches'); showCard(R,R.top[0],0);
  busy=false; document.getElementById('go').disabled=false;
};
function cnt(n,lab){document.getElementById('cnum').textContent=n;
  document.getElementById('clab').textContent=lab;}
function showCard(R,d,i){const card=document.getElementById('card');card.style.display='block';
  let h=`<h2>${d.title}</h2><div class="rk">rank ${i+1} · similarity ${d.sim} · “${R.query}”</div>`;
  if(!d.edges.length) h+=`<div class="vecnote">No sensory axis covers this craving — ranked by profile-vector similarity alone.</div>`;
  d.edges.forEach(e=>{h+=`<div class="ax"><div class="nm"><span>${e.axis}</span><span>${e.value} vs target ${e.target}</span></div>
    <div class="meter"><i style="width:${e.value*100}%"></i><b style="left:${e.target*100}%"></b></div>`;
    e.evidence.forEach(ev=>h+=`<div class="ev">“${ev}”</div>`); h+=`</div>`;});
  card.innerHTML=h;}
</script></body></html>
